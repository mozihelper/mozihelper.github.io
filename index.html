<!DOCTYPE html>
<html lang="ru" data-theme="dusk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>MoziHelper</title>
<script>
  try {
    var t = localStorage.getItem('la_theme') || 'dusk';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dusk');
  }
</script>
<style>
  :root, [data-theme="dusk"] {
    --bg: #0a0c10;
    --bg-card: #13161c;
    --bg-soft: #181c23;
    --bg-elev: #1f242c;
    --ink: #eceef2;
    --ink-soft: #a4abb8;
    --ink-mute: #687081;
    --accent: #5ba4ff;
    --accent-strong: #2d88ff;
    --accent-deep: #1877f2;
    --border: #2a2f38;
    --border-soft: #1c2129;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
  }

  [data-theme="paper"] {
    --bg: #f0f2f5;
    --bg-card: #ffffff;
    --bg-soft: #f7f8fa;
    --bg-elev: #ffffff;
    --ink: #1c1e21;
    --ink-soft: #444950;
    --ink-mute: #8a8d91;
    --accent: #1877f2;
    --accent-strong: #1877f2;
    --accent-deep: #0d5dc9;
    --border: #dadde1;
    --border-soft: #e7e9ec;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.10);
    color-scheme: light;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 22px;
    /* визуальный центр чуть выше геометрического */
    padding-bottom: clamp(56px, 12vh, 130px);
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-strong); }

  .theme-btn {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 44px;
    height: 44px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--ink-soft);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .theme-btn:hover { border-color: var(--accent-strong); color: var(--accent); }
  .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .theme-btn svg { width: 19px; height: 19px; }
  .theme-btn .icon-sun { display: none; }
  .theme-btn .icon-moon { display: block; }
  [data-theme="paper"] .theme-btn .icon-sun { display: block; }
  [data-theme="paper"] .theme-btn .icon-moon { display: none; }

  .home {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: clamp(30px, 6vh, 48px);
  }

  .head { display: flex; flex-direction: column; gap: 14px; }

  /* ── Логотип: буквы выезжают из-под линии обреза ── */
  .wordmark {
    display: flex;
    font-size: clamp(2.6rem, 12vw, 3.9rem);
    font-weight: 600;
    letter-spacing: -0.022em;
    line-height: 1;
    white-space: nowrap;
  }
  .wordmark .wm-part {
    display: inline-block;
    overflow: hidden;
    padding-bottom: .06em;
    margin-bottom: -.06em;
  }
  .wordmark .wm-part > span {
    display: block;
    transform: translateY(105%);
    animation: letterRise .72s cubic-bezier(.16, 1, .3, 1) forwards;
  }
  .wordmark .wm-part:nth-child(1) > span  { animation-delay: .02s; }
  .wordmark .wm-part:nth-child(2) > span  { animation-delay: .05s; }
  .wordmark .wm-part:nth-child(3) > span  { animation-delay: .08s; }
  .wordmark .wm-part:nth-child(4) > span  { animation-delay: .11s; }
  .wordmark .wm-part:nth-child(5) > span  { animation-delay: .15s; }
  .wordmark .wm-part:nth-child(6) > span  { animation-delay: .18s; }
  .wordmark .wm-part:nth-child(7) > span  { animation-delay: .21s; }
  .wordmark .wm-part:nth-child(8) > span  { animation-delay: .24s; }
  .wordmark .wm-part:nth-child(9) > span  { animation-delay: .27s; }
  .wordmark .wm-part:nth-child(10) > span { animation-delay: .30s; }
  .wordmark .accent { color: var(--accent); }

  /* тонкая линия под логотипом раскрывается слева направо */
  .rule {
    height: 1px;
    background: var(--border);
    transform: scaleX(0);
    transform-origin: left;
    animation: ruleIn .8s cubic-bezier(.16, 1, .3, 1) .34s forwards;
  }

  .prompt {
    font-size: .95rem;
    color: var(--ink-mute);
    letter-spacing: .01em;
    opacity: 0;
    animation: rise .55s cubic-bezier(.16, 1, .3, 1) .46s forwards;
  }

  .semesters { display: grid; gap: 10px; }

  .sem-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    border-radius: 14px;
    text-decoration: none;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--ink);
    opacity: 0;
    animation: rise .6s cubic-bezier(.16, 1, .3, 1) forwards;
  }
  .sem-btn:nth-child(1) { animation-delay: .54s; }
  .sem-btn:nth-child(2) { animation-delay: .62s; }
  .sem-btn:hover { border-color: var(--accent-strong); background: var(--bg-soft); color: var(--ink); }
  .sem-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .sem-mark {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.02rem;
    font-weight: 600;
    letter-spacing: .04em;
    color: #fff;
    background: var(--accent-deep);
  }

  .sem-title { font-size: 1.05rem; font-weight: 500; line-height: 1.2; }

  .sem-arrow {
    margin-left: auto;
    flex-shrink: 0;
    display: flex;
    color: var(--ink-mute);
    transition: transform .22s cubic-bezier(.16, 1, .3, 1), color .18s ease;
  }
  .sem-btn:hover .sem-arrow { color: var(--accent); transform: translateX(4px); }
  .sem-arrow svg { width: 20px; height: 20px; }

  .resources {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    opacity: 0;
    animation: rise .6s cubic-bezier(.16, 1, .3, 1) .72s forwards;
  }
  .res-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 15px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-soft);
    text-decoration: none;
    font-size: .88rem;
    font-weight: 500;
  }
  .res-pill:hover { color: var(--accent); border-color: var(--accent-strong); background: var(--bg-card); }
  .res-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .res-pill svg { width: 15px; height: 15px; flex-shrink: 0; }

  @keyframes letterRise { to { transform: translateY(0); } }
  @keyframes ruleIn { to { transform: scaleX(1); } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  /* ── Смена темы: круговая волна от кнопки ── */
  ::view-transition-old(root),
  ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-old(root) { z-index: 1; }
  ::view-transition-new(root) { z-index: 2; animation: waveReveal .55s cubic-bezier(.4, 0, .2, 1) forwards; }
  @keyframes waveReveal {
    from { clip-path: circle(0 at var(--wave-x, 100%) var(--wave-y, 0)); }
    to   { clip-path: circle(var(--wave-r, 150vmax) at var(--wave-x, 100%) var(--wave-y, 0)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .wordmark .wm-part > span { animation: none; transform: none; }
    .rule { animation: none; transform: none; }
    .prompt, .sem-btn, .resources { animation: none; opacity: 1; }
    .sem-btn:hover .sem-arrow { transform: none; }
  }
</style>
<link rel="stylesheet" href="motion.css">
</head>
<body>
  <button class="theme-btn" onclick="toggleTheme(event)" aria-label="Сменить тему">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>

  <main class="home">
    <div class="head">
      <h1 class="wordmark" aria-label="MoziHelper"><span class="wm-part"><span>M</span></span><span class="wm-part"><span>o</span></span><span class="wm-part"><span>z</span></span><span class="wm-part"><span>i</span></span><span class="wm-part accent"><span>H</span></span><span class="wm-part accent"><span>e</span></span><span class="wm-part accent"><span>l</span></span><span class="wm-part accent"><span>p</span></span><span class="wm-part accent"><span>e</span></span><span class="wm-part accent"><span>r</span></span></h1>
      <div class="rule"></div>
      <p class="prompt">Справочник по линейной алгебре — выберите семестр</p>
    </div>

    <nav class="semesters">
      <a class="sem-btn" href="algebra-sem1.html">
        <span class="sem-mark">I</span>
        <span class="sem-title">1 семестр</span>
        <span class="sem-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </span>
      </a>

      <a class="sem-btn" href="algebra-sem2.html">
        <span class="sem-mark">II</span>
        <span class="sem-title">2 семестр</span>
        <span class="sem-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </span>
      </a>
    </nav>

    <div class="resources">
      <a class="res-pill" href="literatura.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Литература
      </a>
      <a class="res-pill" href="links.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Полезные ссылки
      </a>
    </div>
  </main>

  <script>
    function applyTheme(next) {
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('la_theme', next); } catch (e) {}
    }

    function toggleTheme(ev) {
      var cur = document.documentElement.getAttribute('data-theme') || 'dusk';
      var next = cur === 'dusk' ? 'paper' : 'dusk';
      var x = (ev && ev.clientX) || window.innerWidth - 32;
      var y = (ev && ev.clientY) || 32;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (document.startViewTransition && !reduce) {
        var root = document.documentElement;
        root.style.setProperty('--wave-x', x + 'px');
        root.style.setProperty('--wave-y', y + 'px');
        root.style.setProperty('--wave-r', Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 'px');
        document.startViewTransition(function () { applyTheme(next); });
        return;
      }
      applyTheme(next);
    }
  </script>
  <script src="motion.js"></script>
</body>
</html>
