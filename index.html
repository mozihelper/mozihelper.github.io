<!DOCTYPE html>
<html lang="ru" data-theme="dusk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoziHelper</title>
<script>(function(){var h=document.documentElement;try{h.setAttribute('data-theme',localStorage.getItem('la_theme')||'dusk');h.setAttribute('data-motion',localStorage.getItem('la_motion')||'full');if(sessionStorage.getItem('la_sweep')){sessionStorage.removeItem('la_sweep');h.classList.add('arriving','no-intro');}else{var nv=(performance.getEntriesByType&&performance.getEntriesByType('navigation')[0])||{};if(nv.type==='reload'||nv.type==='back_forward')h.classList.add('no-intro');}}catch(e){h.setAttribute('data-theme','dusk');h.setAttribute('data-motion','full');}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*TOKENS*/
[data-theme="dusk"]{
  --bg:#0c0c0e; --bg-2:#141416; --ink:#f2f0ec; --ink-2:#94918b; --ink-3:#5c5a55;
  --rule:#26262a; --hot:#ff4a24; --hot-2:#ff4a24; --hot-ink:#fff; --flood:#ff4a24;
  color-scheme:dark;
}
[data-theme="paper"]{
  --bg:#f7f4ef; --bg-2:#ffffff; --ink:#101012; --ink-2:#5a5852; --ink-3:#94918a;
  --rule:#dedad2; --hot:#e03c14; --hot-2:#e03c14; --hot-ink:#fff; --flood:#e03c14;
  color-scheme:light;
}
/*ENDTOKENS*/

*{margin:0;padding:0;box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  font-family:'Golos Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100svh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background .45s ease,color .45s ease;
}
a{color:var(--hot)}
a:hover{color:var(--ink)}
::selection{background:var(--hot);color:var(--hot-ink)}

.page{
  position:relative;min-height:100svh;
  display:grid;grid-template-rows:1fr auto;justify-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 72px) 0 calc(env(safe-area-inset-bottom,0px) + 10px);
  text-align:center;
}
.gut{width:100%;padding-inline:20px}

/* ── переключатель темы: в углу, зона нажатия 46px ── */
.top{
  position:absolute;z-index:5;
  top:calc(env(safe-area-inset-top,0px) + 18px);
  right:calc(env(safe-area-inset-right,0px) + 16px);
  opacity:0;animation:fd .55s ease .1s forwards;
}
.tsw{position:relative;display:inline-flex;border:1px solid var(--rule)}
.tsw-knob{
  position:absolute;top:0;bottom:0;left:0;width:50%;background:var(--hot);
  transition:transform .42s cubic-bezier(.65,0,.15,1);
}
[data-theme="paper"] .tsw-knob{transform:translateX(100%)}
.tsw-b{
  position:relative;z-index:1;border:0;background:transparent;cursor:pointer;font-family:inherit;
  font-size:.605rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  padding:11px 13px 10px;color:var(--ink-2);line-height:1;
  transition:color .32s ease;-webkit-tap-highlight-color:transparent;
}
.tsw-b::before{content:'';position:absolute;inset:-8px -3px}
.tsw-b:first-of-type::before{left:-10px}
.tsw-b:last-of-type::before{right:-10px}
[data-theme="dusk"] .tsw-b[data-t="dusk"],
[data-theme="paper"] .tsw-b[data-t="paper"]{color:var(--hot-ink)}
.tsw-b:focus-visible{outline:2px solid var(--hot);outline-offset:4px}

/* ── центральный блок ── */
.core{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;max-width:980px;padding-block:4px;
}

.wm{
  display:block;width:100%;overflow:hidden;
  font-family:'Unbounded',sans-serif;font-weight:400;
  line-height:1;letter-spacing:-.02em;
  padding:.1em 0 .18em;font-size:52px;
  visibility:hidden;
}
.wm.fitted{visibility:visible}
.wm .i{
  display:inline-block;white-space:nowrap;
}
.wm .hot{font-weight:700;letter-spacing:-.05em;color:var(--hot)}

.kicker{
  margin-top:15px;font-size:.665rem;font-weight:500;letter-spacing:.26em;
  text-transform:uppercase;color:var(--ink-2);
  opacity:0;animation:fd .7s ease .66s forwards;
}

.resume{
  display:none;align-items:center;gap:11px;margin-top:20px;padding:12px 16px;
  background:var(--bg-2);border:1px solid var(--rule);
  color:var(--ink);text-decoration:none;font-size:.86rem;max-width:100%;min-height:46px;
  transition:border-color .24s ease;
}
.resume.on{display:inline-flex;opacity:0;animation:fd .6s ease .8s forwards}
.resume:hover{border-color:var(--hot);color:var(--ink)}
.resume:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
.resume em{font-style:normal;font-size:.6rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--hot-2);flex-shrink:0}
.resume span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── два билета ── */
.picks{
  margin-top:32px;width:100%;display:grid;grid-template-columns:1fr;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
}
.pick{
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:flex-start;gap:16px;
  padding:24px 20px 25px 26px;min-height:88px;
  text-decoration:none;color:inherit;text-align:left;
  opacity:0;animation:fd .72s ease var(--d,0s) forwards;
  -webkit-tap-highlight-color:transparent;
}
.pick + .pick{border-top:1px solid var(--rule)}
.pick::before{
  content:'';position:absolute;inset:0;background:var(--hot);
  transform:translateY(101%);transition:transform .46s cubic-bezier(.66,0,.2,1);
}
.pick>*{position:relative;z-index:1}
.pick:hover::before,.pick:active::before{transform:none}
.pick:hover,.pick:active{color:var(--hot-ink)}
.pick:focus-visible{outline:3px solid var(--hot);outline-offset:-3px}

.rn{
  font-family:'Unbounded',sans-serif;font-weight:700;
  font-size:2.45rem;line-height:.94;letter-spacing:-.045em;color:var(--hot-2);
  min-width:1.4em;flex-shrink:0;
  transition:color .3s ease,transform .46s cubic-bezier(.2,1.2,.4,1);
}
.pick:hover .rn,.pick:active .rn{color:var(--hot-ink);transform:translateX(4px)}
.pl{
  font-size:1.1rem;font-weight:500;letter-spacing:-.012em;
  transition:color .3s ease,transform .46s cubic-bezier(.2,1.2,.4,1) .045s;
}
.pick:hover .pl,.pick:active .pl{transform:translateX(4px)}

/* ── подвал ── */
.tailer{
  display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:0 0;row-gap:4px;max-width:100%;
  opacity:0;animation:fd .7s ease 1.16s forwards;
}
.tl{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-2);text-decoration:none;
  font-size:.92rem;font-weight:500;padding:14px 16px;min-height:46px;
  transition:color .24s ease;-webkit-tap-highlight-color:transparent;
}
.tl::after{
  content:'';position:absolute;left:16px;right:16px;bottom:13px;height:1.5px;background:var(--hot-2);
  transform:scaleX(0);transform-origin:left;
  transition:transform .38s cubic-bezier(.2,.9,.2,1);
}
.tl:hover{color:var(--ink)}
.tl:hover::after{transform:scaleX(1)}
.tl:focus-visible{outline:2px solid var(--hot);outline-offset:0}
.sep{width:1px;height:13px;background:var(--rule);flex-shrink:0}
@media (max-width:520px){
  /* два в ряд: «Литература · Лекции I» и «Лекции II · Полезные ссылки» */
  .tailer{max-width:340px;margin-inline:auto}
  .tailer .sep:nth-of-type(2){display:none;width:100%;height:0}
}

@keyframes fd{to{opacity:1}}

.flood{position:fixed;inset:0;z-index:99;background:var(--flood);transform:translateY(100%);pointer-events:none}
body.leaving .flood{transform:none;transition:transform .42s cubic-bezier(.66,0,.2,1)}

@media (min-width:760px){
  .gut{padding-inline:56px}
  .page{padding-top:82px;padding-bottom:22px}
  .core{padding-block:14px}
  .picks{margin-top:48px;grid-template-columns:1fr 1fr}
  .pick{padding:38px 28px 40px 40px;min-height:0;gap:22px}
  .pick + .pick{border-top:0;border-left:1px solid var(--rule)}
  .rn{font-size:3.4rem}
  .pl{font-size:1.26rem}
  .kicker{margin-top:20px}
}

/* короткий экран (телефон лёжа) — не ломаем, просто ужимаем ритм */
@media (max-height:560px){
  .page{padding-top:64px}
  .picks{margin-top:22px}
  .pick{min-height:74px;padding-block:18px}
  .kicker{margin-top:11px}
}

/* спокойный режим — только по собственному флагу la_motion="calm",
   системная настройка «уменьшить движение» анимации больше не глушит */
[data-motion="calm"] *{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
[data-motion="calm"] .top,[data-motion="calm"] .kicker,[data-motion="calm"] .pick,
[data-motion="calm"] .tailer,[data-motion="calm"] .resume.on{opacity:1}

.curtain{
  position:fixed;inset:0;z-index:98;background:var(--hot);
  transform:translate3d(0,100%,0);pointer-events:none;will-change:transform;contain:strict;
}
.curtain.up{transform:translate3d(0,0,0);transition:transform .42s cubic-bezier(.65,0,.25,1)}
.curtain.out{transform:translate3d(0,-100%,0);transition:transform .5s cubic-bezier(.35,0,.15,1)}

/* ── приход под шторкой: контент уже отрисован, полотно просто уезжает ── */
html.arriving .curtain{
  transform:translate3d(0,0,0);
  animation:curtainAway .5s cubic-bezier(.35,0,.15,1) 2.4s forwards!important;
}
html.arriving .curtain.out{transform:translate3d(0,-100%,0);transition:transform .5s cubic-bezier(.35,0,.15,1)!important}
/* пока полотно закрыто — на странице не движется вообще ничего */
html.arriving *,html.arriving *::before,html.arriving *::after{animation:none!important;transition:none!important}
@keyframes curtainAway{to{transform:translate3d(0,-100%,0)}}
html.sweeping,html.sweeping body{transition:none!important}
html.no-intro .top,html.no-intro .kicker,html.no-intro .pick,
html.no-intro .tailer,html.no-intro .resume.on{opacity:1!important;animation:none!important}

/* ═══ Правки для iOS/Safari ═══════════════════════════════════
   1. Запрет автоувеличения текста: Safari «раздувает» шрифт, из-за чего
      контейнер становится шире экрана и содержимое уезжает вбок.
   2. Ничто не может быть шире экрана — страховка от горизонтального сдвига.
   3. Под .no-intro не переигрывается ни одна анимация появления
      (шторку не трогаем — она должна доиграть свой уход). */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html,body{max-width:100%;overflow-x:hidden;}

html.no-intro *:not(.curtain):not(.curtain *){animation:none!important;}
html.no-intro .start-greeting,html.no-intro .start-status,html.no-intro .start-eyebrow,
html.no-intro .start-title,html.no-intro .start-message,html.no-intro .start-divider,
html.no-intro .start-cta-group,html.no-intro .start-stats,html.no-intro .stats,
html.no-intro .search-wrap.start-search,html.no-intro .topic-header,html.no-intro .q-card,
html.no-intro .top,html.no-intro .kicker,html.no-intro .pick,
html.no-intro .tailer,html.no-intro .resume.on{opacity:1!important;}

/* Главная: контейнеры не шире экрана, логотип появляется без скачка. */
.page,.core,.gut,.picks,.wm,.kicker,.resume{max-width:100%;}
.wm{transition:opacity .28s ease;}
html.no-intro .wm{transition:none;}
</style>

<meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">

<body>
<div class="flood" aria-hidden="true"></div>
<div class="curtain" id="curtain" aria-hidden="true"></div>

<div class="page">

  <div class="top">
    <div class="tsw" role="group" aria-label="Тема оформления">
      <span class="tsw-knob" aria-hidden="true"></span>
      <button class="tsw-b" data-t="dusk" onclick="pickTheme(event,'dusk')">Ночь</button>
      <button class="tsw-b" data-t="paper" onclick="pickTheme(event,'paper')">День</button>
    </div>
  </div>

  <main class="core gut">
    <h1 class="wm" id="wm" aria-label="MoziHelper"><span class="i">Mozi<span class="hot">Helper</span></span></h1>
    <p class="kicker">Выберите семестр</p>
    <a class="resume" id="resume" href="#"><em>Продолжить</em><span id="resumeTitle"></span></a>

    <nav class="picks">
      <a class="pick" href="algebra-sem1.html" style="--d:.88s">
        <span class="rn">I</span>
        <span class="pl">1 семестр</span>
      </a>
      <a class="pick" href="algebra-sem2.html" style="--d:.98s">
        <span class="rn">II</span>
        <span class="pl">2 семестр</span>
      </a>
    </nav>
  </main>

  <div class="tailer">
    <a class="tl" href="literatura.html">Литература</a>
    <span class="sep" aria-hidden="true"></span>
    <a class="tl" href="lekcii-sem1.html">Лекции I</a>
    <span class="sep" aria-hidden="true"></span>
    <a class="tl" href="lekcii-sem2.html">Лекции II</a>
    <span class="sep" aria-hidden="true"></span>
    <a class="tl" href="links.html">Полезные ссылки</a>
  </div>

</div>

<script>
/* ── подгонка логотипа: одна строка, размер под ширину колонки ──
   меряем не сам заголовок (он в overflow:hidden), а образец за экраном */
(function(){
  var wm=document.getElementById('wm'),inner=wm.firstElementChild,t=null;
  var probe=document.createElement('span');
  probe.innerHTML=inner.innerHTML;
  probe.setAttribute('aria-hidden','true');
  probe.style.cssText='position:fixed;left:-99999px;top:0;white-space:nowrap;'+
    'font-family:Unbounded,sans-serif;font-weight:400;font-size:100px;letter-spacing:-.02em;'+
    'pointer-events:none;visibility:hidden';
  var ph=probe.querySelector('.hot');
  if(ph)ph.style.cssText='font-weight:700;letter-spacing:-.05em';
  document.body.appendChild(probe);

  function fit(){
    /* НЕ доверяем clientWidth вслепую: если у страницы есть горизонтальное переполнение,
       он больше экрана — и логотип раздувается ещё сильнее. Ограничиваем шириной viewport. */
    var vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    var avail = Math.min(wm.clientWidth || vw, vw - 24);
    if(avail <= 0) return;
    var w = probe.getBoundingClientRect().width;
    if(!w) return;
    /* на телефоне логотип почти во всю колонку, на десктопе — сдержанно */
    var factor = avail < 600 ? 0.94 : 0.56;
    var size = Math.min(100 * Math.min(avail, 1000) * factor / w, 124);
    wm.style.fontSize = size.toFixed(2) + 'px';
    /* дожимаем, пока строка не влезет — одного прохода на iOS не хватает */
    for(var i = 0; i < 6; i++){
      var over = inner.getBoundingClientRect().width - avail;
      if(over <= 0.5) break;
      size = size * avail / (avail + over) * 0.995;
      wm.style.fontSize = size.toFixed(2) + 'px';
    }
    wm.classList.add('fitted');
  }
  fit();
  requestAnimationFrame(fit);
  /* Safari сообщает о готовности шрифтов раньше, чем реально применит Unbounded:
     размер считался по системному шрифту и надпись потом «съезжала». */
  if(document.fonts){
    if(document.fonts.ready)document.fonts.ready.then(function(){fit();setTimeout(fit,60);});
    try{
      Promise.all([
        document.fonts.load('400 100px Unbounded'),
        document.fonts.load('700 100px Unbounded')
      ]).then(function(){fit();requestAnimationFrame(fit);}).catch(function(){});
    }catch(e){}
  }
  /* Панели Safari меняют высоту viewport при скролле — ширина та же.
     Пересчитываем только при смене ширины, иначе логотип дёргается. */
  var lastW=window.visualViewport?Math.round(window.visualViewport.width):window.innerWidth;
  addEventListener('resize',function(){
    var w=window.visualViewport?Math.round(window.visualViewport.width):window.innerWidth;
    if(w===lastW)return;
    lastW=w;clearTimeout(t);t=setTimeout(fit,90);
  },{passive:true});
  addEventListener('orientationchange',function(){setTimeout(fit,220);setTimeout(fit,450);});
  addEventListener('pageshow',function(e){if(e.persisted)setTimeout(fit,50);});
})();

function calm(){return document.documentElement.getAttribute('data-motion')==='calm';}
function applyTheme(n){
  document.documentElement.setAttribute('data-theme',n);
  try{localStorage.setItem('la_theme',n);}catch(e){}
}
function pickTheme(ev,next){
  if((document.documentElement.getAttribute('data-theme')||'dusk')===next)return;
  var c=document.getElementById('curtain');
  if(!c||calm()){applyTheme(next);return;}
  if(c.dataset.busy)return;
  c.dataset.busy='1';
  c.classList.remove('out');c.classList.add('up');
  setTimeout(function(){
    applyTheme(next);
    c.classList.add('out');
    setTimeout(function(){
      c.style.transition='none';c.classList.remove('up','out');
      requestAnimationFrame(function(){c.style.transition='';c.removeAttribute('data-busy');});
    },470);
  },400);
}

(function(){
  try{
    var raw=localStorage.getItem('la_last');if(!raw)return;
    var d=JSON.parse(raw);if(!d||!d.href||!d.title)return;
    var a=document.getElementById('resume');
    a.href=d.href;document.getElementById('resumeTitle').textContent=d.title;
    a.classList.add('on');
  }catch(e){}
})();

(function(){
  if(calm())return;
  document.querySelectorAll('a[href]:not([target])').forEach(function(a){
    a.addEventListener('click',function(e){
      var href=a.getAttribute('href');
      if(!href||href.charAt(0)==='#'||e.metaKey||e.ctrlKey||e.shiftKey)return;
      e.preventDefault();leavePage(href);
    });
  });
})();
/* ── Переход между страницами одним движением ──
   Уходящая страница закрывает экран шторкой и НЕ уводит её обратно;
   доигрывает уже новая страница (флаг la_sweep → html.arriving),
   причём её содержимое отрисовано без анимаций входа. Раньше уход и приход
   играли по отдельности — отсюда и виделся лаг с лишней анимацией. */
function leavePage(href){
  var c=document.getElementById('curtain');
  if(!c||calm()){location.href=href;return;}
  if(c.getAttribute('data-busy'))return;
  c.setAttribute('data-busy','1');
  document.documentElement.classList.add('sweeping');
  try{sessionStorage.setItem('la_sweep','1');}catch(e){}
  /* переход по таймеру, а НЕ по transitionend: на тяжёлой странице событие может не прийти */
  requestAnimationFrame(function(){requestAnimationFrame(function(){c.classList.add('up');});});
  setTimeout(function(){location.href=href;},420);
}
function finishArrival(){
  var h=document.documentElement;
  if(!h.classList.contains('arriving'))return;
  var c=document.getElementById('curtain');
  if(!c){h.classList.remove('arriving');return;}
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    c.classList.add('out');
    setTimeout(function(){
      c.style.transition='none';c.classList.remove('up','out');
      h.classList.remove('sweeping','arriving');
      requestAnimationFrame(function(){c.style.transition='';});
    },480);
  });});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',finishArrival);
else finishArrival();

</script>

<script>
/* ═══ Правки поведения ════════════════════════════════════════
   Возврат «назад»: страница восстанавливается из кэша браузера ровно в том
   виде, в каком её покинули, — то есть с поднятой шторкой на весь экран
   (отсюда сплошной оранжевый фон). DOMContentLoaded при этом не срабатывает,
   поэтому шторку сбрасываем по pageshow. */
(function () {
  function resetCurtain() {
    var c = document.getElementById('curtain');
    var h = document.documentElement;
    h.classList.remove('sweeping', 'arriving');
    if (!c) return;
    c.style.transition = 'none';
    c.classList.remove('up', 'out');
    c.removeAttribute('data-busy');
    requestAnimationFrame(function () { c.style.transition = ''; });
  }
  addEventListener('pageshow', resetCurtain);
  addEventListener('popstate', resetCurtain);
})();

/* Страховка на приходе: если штатное завершение перехода почему-то не отработало
   (например, скрипт страницы не успел), уводим шторку сами. Если уход уже идёт
   (на шторке есть класс out) — не вмешиваемся, чтобы не получилось две волны. */
(function () {
  var h = document.documentElement;
  if (!h.classList.contains('arriving')) return;
  setTimeout(function () {
    var c = document.getElementById('curtain');
    if (!c || !h.classList.contains('arriving')) return;
    if (c.classList.contains('out')) return;
    c.classList.add('out');
    setTimeout(function () {
      c.style.transition = 'none';
      c.classList.remove('up', 'out');
      h.classList.remove('sweeping', 'arriving');
      requestAnimationFrame(function () { c.style.transition = ''; });
    }, 480);
  }, 2600);
})();
</script>
